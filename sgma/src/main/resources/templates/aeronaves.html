<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><div><p class="eyebrow">CADASTROS</p><h1>Aeronaves</h1><p>Cada aeronave fica vinculada a um cliente.</p></div></header><section class="panel form-panel"><h2>Nova aeronave</h2><p th:if="${#lists.isEmpty(clientes)}">Primeiro, <a th:href="@{/clientes}">cadastre um cliente</a>.</p><form th:unless="${#lists.isEmpty(clientes)}" th:action="@{/aeronaves}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><div class="form-grid"><label>Matrícula<input th:field="*{matricula}" placeholder="Ex.: PT-ABC" pattern="[A-Za-z0-9-]{3,12}" maxlength="12" required></label><label>Cliente<select aria-label="Cliente" th:field="*{clienteId}" required><option value="">Selecione o proprietário</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option></select></label><label>Fabricante<input th:field="*{fabricante}" maxlength="80" required></label><label>Modelo<input th:field="*{modelo}" maxlength="80" required></label></div><button>Cadastrar aeronave</button></form></section><section class="panel"><div class="section-heading"><h2>Frota cadastrada</h2></div><div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Fabricante</th><th>Modelo</th><th>Cliente</th></tr></thead><tbody><tr th:each="a : ${aeronaves}"><td><strong th:text="${a.matricula}"></strong></td><td th:text="${a.fabricante}"></td><td th:text="${a.modelo}"></td><td th:text="${a.cliente.nome}"></td></tr><tr th:if="${#lists.isEmpty(aeronaves)}"><td colspan="4" class="empty">Nenhuma aeronave cadastrada.</td></tr></tbody></table></div></section></main></body></html>
