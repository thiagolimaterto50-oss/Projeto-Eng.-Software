<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body class="login-page"><section class="panel form-panel login-card"><p class="eyebrow">GESTÃO DE SERVIÇOS AERONÁUTICOS</p><h1>Entrar no SGMA</h1><p>Acesse com seu e-mail e senha.</p><p class="error" role="alert" th:if="${param.error}">E-mail ou senha inválidos, ou conta inativa.</p><p class="success" role="status" th:if="${param.logout}">Sessão encerrada.</p><form th:action="@{/login}" method="post"><label>E-mail<input type="email" name="username" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form></section></body></html>
