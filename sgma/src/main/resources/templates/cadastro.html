<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body class="public-page"><header th:replace="~{publico :: cabecalho}"></header><main class="public-main auth-main"><section class="panel form-panel registration-card"><p class="eyebrow">SEU ACESSO AO SGMA</p><h1>Criar conta de cliente</h1><p>Cadastre seus dados para acompanhar solicitações e orçamentos.</p><form th:action="@{/cadastro}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><div class="form-grid"><label>Nome<input th:field="*{nome}" required maxlength="120" autocomplete="name"></label><label>E-mail<input th:field="*{email}" type="email" required maxlength="180" autocomplete="email"></label><label>Documento<input th:field="*{documento}" required maxlength="30"></label><label>Telefone (opcional)<input th:field="*{telefone}" type="tel" maxlength="30" autocomplete="tel"></label><label>Senha<input name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label>Confirmar senha<input name="confirmacaoSenha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label></div><p class="muted">Use no mínimo 8 caracteres e no máximo 72 bytes. Após o cadastro, entre na sua conta. O gestor fará o vínculo das suas aeronaves.</p><button>Criar conta</button></form><p>Já tem conta? <a th:href="@{/login}">Entrar</a></p></section></main><footer th:replace="~{publico :: rodape}"></footer></body></html>
