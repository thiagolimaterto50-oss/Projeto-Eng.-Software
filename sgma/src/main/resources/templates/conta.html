<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><h1>Minha conta</h1></header><section class="panel form-panel" th:if="${cliente}"><h2>Meus dados</h2>
<form th:action="@{/conta/dados}" th:object="${form}" method="post">
<div th:replace="~{fragmentos :: erros}"></div>
<label>Nome<input th:field="*{nome}" maxlength="120" required></label>
<label>E-mail<input type="email" th:field="*{email}" maxlength="180" required></label>
<label>Documento<input th:field="*{documento}" maxlength="30" required></label>
<label>Telefone<input th:field="*{telefone}" maxlength="30"></label>
<button>Salvar meus dados</button></form></section><section class="panel form-panel"><h2>Alterar senha</h2><form th:action="@{/conta/senha}" method="post"><label>Senha atual<input type="password" name="senhaAtual" required autocomplete="current-password"></label><label>Nova senha<input type="password" name="novaSenha" required minlength="8" maxlength="72" autocomplete="new-password"></label><p class="muted">Use no mínimo 8 caracteres e no máximo 72 bytes.</p><button>Alterar senha</button></form></section></main></body></html>
