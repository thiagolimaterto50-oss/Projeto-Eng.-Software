<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><a class="back" th:href="@{/solicitacoes}">← Solicitações</a><header><div><p class="eyebrow">NOVO ATENDIMENTO</p><h1>Abrir solicitação</h1><p>Informe a aeronave e descreva o serviço necessário.</p></div></header><section class="panel form-panel"><p th:if="${#lists.isEmpty(aeronaves)}">Para começar, <a th:href="@{/aeronaves}">solicite o cadastro de uma aeronave ao gestor</a>.</p><form th:unless="${#lists.isEmpty(aeronaves)}" th:action="@{/solicitacoes}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><div class="form-grid"><label>Aeronave / cliente<select aria-label="Aeronave / cliente" th:field="*{aeronaveId}" required><option value="">Selecione a aeronave</option><option th:each="a : ${aeronaves}" th:value="${a.id}" th:text="${a.matricula} + ' · ' + ${a.cliente.nome}"></option></select></label><label>Tipo de serviço<select aria-label="Tipo de serviço" th:field="*{tipoServico}" required><option value="">Selecione o serviço</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></label></div><label>Descrição<textarea th:field="*{descricao}" rows="6" maxlength="2000" required placeholder="Descreva o problema ou serviço solicitado, com os detalhes disponíveis."></textarea></label><p class="muted">A solicitação será registrada como aberta. O cliente será identificado pelo vínculo da aeronave.</p><button>Abrir solicitação</button></form></section></main></body></html>
