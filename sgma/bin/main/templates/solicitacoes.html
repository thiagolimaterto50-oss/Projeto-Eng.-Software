<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><div><p class="eyebrow">OPERAÇÕES</p><h1>Solicitações</h1><p>Encontre registros e acompanhe cada atendimento.</p></div><a class="button" th:if="${cliente}" th:href="@{/solicitacoes/nova}">+ Nova solicitação</a></header><section class="panel"><form class="filters" th:action="@{/solicitacoes}" method="get"><label class="grow">Busca<input name="busca" th:value="${busca}" placeholder="Cliente, matrícula ou descrição"></label><label>Situação<select aria-label="Situação" name="situacao"><option value="">Todas as situações</option><option th:each="s : ${situacoes}" th:value="${s}" th:text="${s.rotulo}" th:selected="${s == situacaoSelecionada}"></option></select></label><button>Pesquisar</button><a class="button secondary" th:href="@{/solicitacoes}">Limpar</a></form><div th:replace="~{fragmentos :: tabela}"></div><div class="pagination"><span th:text="${resultado.totalElements} + ' registro(s)'"></span><div><a th:if="${resultado.hasPrevious()}" th:href="@{/solicitacoes(pagina=${resultado.number - 1},busca=${busca},situacao=${situacaoSelecionada})}">← Anterior</a><span th:text="'Página ' + ${resultado.number + 1}"></span><a th:if="${resultado.hasNext()}" th:href="@{/solicitacoes(pagina=${resultado.number + 1},busca=${busca},situacao=${situacaoSelecionada})}">Próxima →</a></div></div></section></main></body></html>
