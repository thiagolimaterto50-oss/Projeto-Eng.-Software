<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><div><p class="eyebrow">CADASTROS</p><h1>Clientes</h1><p>Organize os responsáveis pelas aeronaves.</p></div></header><section class="panel form-panel"><h2>Novo cliente</h2><form th:action="@{/clientes}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><div class="form-grid"><label>Nome<input th:field="*{nome}" maxlength="120" required autocomplete="name"></label><label>E-mail<input type="email" th:field="*{email}" maxlength="180" required autocomplete="email"></label><label>Documento<input th:field="*{documento}" maxlength="30" required></label><label>Telefone<input type="tel" th:field="*{telefone}" maxlength="30" autocomplete="tel"></label></div><label>Senha inicial<input type="password" name="senha" required minlength="8" maxlength="72" autocomplete="new-password"></label><button>Cadastrar cliente</button></form></section><section class="panel"><div class="section-heading"><h2>Clientes cadastrados</h2></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Documento</th><th>Telefone</th><th>Situação</th><th>Ações</th></tr></thead><tbody><tr th:each="c : ${clientes}"><td th:text="${c.nome}"></td><td th:text="${c.email}"></td><td th:text="${c.documento}"></td><td th:text="${c.telefone}"></td><td th:text="${c.ativo ? 'Ativo' : 'Inativo'}"></td><td><a th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="empty">Nenhum cliente cadastrado.</td></tr></tbody></table></div></section></main></body></html>
