<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body class="public-page"><header th:replace="~{publico :: cabecalho}"></header><main class="public-main auth-main"><section class="panel form-panel login-card"><p class="eyebrow">GESTÃO DE SERVIÇOS AERONÁUTICOS</p><h1>Entrar no SGMA</h1><p>Acesse com seu e-mail e senha.</p><p class="error" role="alert" th:if="${param.error}">E-mail ou senha inválidos, ou conta inativa.</p><p class="success" role="status" th:if="${param.logout}">Sessão encerrada.</p><p class="success" role="status" th:if="${sucesso}" th:text="${sucesso}"></p><form th:action="@{/login}" method="post"><label>E-mail<input type="email" name="username" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form><p>Ainda não tem conta? <a th:href="@{/cadastro}">Cadastrar-se</a></p></section></main><footer th:replace="~{publico :: rodape}"></footer></body></html>
