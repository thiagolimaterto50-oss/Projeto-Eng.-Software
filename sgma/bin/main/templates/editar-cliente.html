<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><h1>Editar cliente</h1><a th:href="@{/clientes}">Voltar</a></header><section class="panel form-panel"><form th:action="@{/clientes/{id}/editar(id=${id})}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><div class="form-grid"><label>Nome<input th:field="*{nome}" maxlength="120" required></label><label>E-mail<input type="email" th:field="*{email}" maxlength="180" required></label><label>Documento<input th:field="*{documento}" maxlength="30" required></label><label>Telefone<input th:field="*{telefone}" maxlength="30"></label></div><label>Nova senha (opcional)<input type="password" name="senha" minlength="8" maxlength="72" autocomplete="new-password"></label><p class="muted">Deixe em branco para manter a senha. Clientes antigos sem login precisam de uma senha inicial.</p><label class="check"><input type="checkbox" name="ativo" value="true" th:checked="${ativo}"> Cliente ativo</label><p class="muted">Inativar bloqueia o acesso do cliente, inclusive em sessões já abertas. O histórico é preservado.</p><button>Salvar cliente</button></form></section></main></body></html>
