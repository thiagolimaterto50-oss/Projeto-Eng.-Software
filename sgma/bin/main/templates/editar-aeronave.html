<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head}"></head><body><aside th:replace="~{fragmentos :: menu}"></aside><main><div th:replace="~{fragmentos :: aviso}"></div><header><h1>Editar aeronave</h1><a th:href="@{/aeronaves}">Voltar</a></header><section class="panel form-panel"><form th:action="@{/aeronaves/{id}/editar(id=${id})}" th:object="${form}" method="post"><div th:replace="~{fragmentos :: erros}"></div><input type="hidden" th:field="*{clienteId}"><div class="form-grid"><label>Matrícula<input th:field="*{matricula}" pattern="[A-Za-z0-9-]{3,12}" required maxlength="12"></label><label>Fabricante<input th:field="*{fabricante}" required maxlength="80"></label><label>Modelo<input th:field="*{modelo}" required maxlength="80"></label></div><label>Justificativa do vínculo<textarea name="justificativaVinculo" maxlength="1000" rows="3" th:text="${justificativaVinculo}"></textarea></label><label class="check"><input type="checkbox" name="ativa" value="true" th:checked="${ativa}"> Aeronave ativa</label><p class="muted">O proprietário é preservado. Aeronaves inativas não podem receber novas solicitações.</p><button>Salvar aeronave</button></form></section></main></body></html>
